name: Telegram Wholesalers Scraper

on:
  schedule:
    # Exécution automatique toutes les 2 heures (100% gratuit, 24h/24 sans votre PC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permet de lancer le scraper manuellement en un clic sur GitHub

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permet de sauvegarder l'historique canaux_vus.json sur le dépôt

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Exécuter le scraper Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_DESTINATION: "-5044680159"
          RUN_ONCE: "true"
        run: |
          python tgrm.py

      - name: Sauvegarder les nouveaux canaux vus (Anti-doublon)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add canaux_vus.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bot): mise à jour automatique des canaux vus [skip ci]" && git push)
